name: React Native Giving CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm run security:prepare

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Inspect package archive
        run: npm pack --dry-run

      - name: Install example dependencies
        working-directory: example
        run: |
          npm ci --ignore-scripts
          npm run security:prepare
          npm run test:security

      - name: Type-check example
        working-directory: example
        run: npm run typecheck

      - name: Resolve Expo configuration
        working-directory: example
        run: npx expo config --type prebuild --json > /dev/null

      - name: Verify Expo dependency compatibility
        working-directory: example
        run: npx expo install --check

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: [., example]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Block high and critical dependency advisories
        working-directory: ${{ matrix.directory }}
        run: |
          npm ci --ignore-scripts
          npm run security:check
